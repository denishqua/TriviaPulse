<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rings behind Saturn -->
  <ellipse cx="50" cy="50" rx="45" ry="12" fill="none" stroke="#fef08a" stroke-width="6" transform="rotate(-15, 50, 50)" opacity="0.6"/>
  <!-- Planet Saturn body -->
  <circle cx="50" cy="50" r="32" fill="#eab308"/>
  <rect x="20" y="44" width="60" height="6" rx="3" fill="#ca8a04" opacity="0.6"/>
  <!-- Rings in front of Saturn -->
  <path d="M 12 60 A 45 12 0 0 0 88 40" fill="none" stroke="#fef08a" stroke-width="6" opacity="0.9" transform="rotate(-15, 50, 50)"/>
</svg>
